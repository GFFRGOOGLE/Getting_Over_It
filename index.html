<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
  <meta name="theme-color" content="#1a1a1a">
  <title>Getting Over It — 2D</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game-wrap">
    <canvas id="game"></canvas>
  </div>

  <!-- HUD (Интерфейс) -->
  <div id="hud" class="hidden">
    <div id="hud-left">
      <button id="pause-btn">⏸️</button>
      <span id="timer">00:00</span>
    </div>
    <div id="hud-right">
      <span id="falls">Падений: 0</span>
    </div>
  </div>

  <!-- Главное меню -->
  <div id="start-screen" class="overlay">
    <h1>Getting Over It</h1>
    <p>2D Clone</p>
    <button id="start-btn" class="btn-green">Играть</button>
  </div>

  <!-- Меню паузы -->
  <div id="pause-menu" class="overlay hidden">
    <h2>Пауза</h2>
    <button id="resume-btn" class="btn-green">Продолжить</button>
    <button id="restart-btn" class="btn-red">Начать заново</button>
  </div>

  <!-- Экран победы -->
  <div id="win-screen" class="overlay hidden">
    <h1>Победа!</h1>
    <p>Время: <span id="win-time">00:00</span></p>
    <p>Падений: <span id="win-falls">0</span></p>
    <button id="win-restart-btn" class="btn-green">Играть снова</button>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>

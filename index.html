<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
  <meta name="theme-color" content="#1a1a1a">
  <title>Getting Over It — 2D</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: #1a1a1a;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: #eee; touch-action: none; overscroll-behavior: none;
      user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
    }
    #game-wrap { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; }
    canvas#game { display: block; width: 100%; height: 100%; cursor: none; touch-action: none; }
    .overlay {
      position: fixed; inset: 0; background: rgba(15, 15, 20, 0.85);
      backdrop-filter: blur(8px); display: flex; flex-direction: column;
      justify-content: center; align-items: center; z-index: 100; transition: opacity 0.3s;
    }
    .overlay h1 { font-size: 36px; margin-bottom: 5px; color: #fff; text-shadow: 0 4px 10px rgba(0,0,0,0.5); }
    .overlay h2 { font-size: 28px; margin-bottom: 20px; color: #fff; }
    .overlay p { font-size: 18px; margin-bottom: 20px; color: #aaa; }
    .overlay button {
      font-family: inherit; font-size: 18px; font-weight: bold;
      padding: 12px 30px; border: none; border-radius: 12px;
      cursor: pointer; margin: 8px; width: 220px; transition: transform 0.1s, filter 0.2s;
    }
    .overlay button:active { transform: scale(0.95); }
    .overlay button:hover { filter: brightness(1.1); }
    .btn-green { background: #4CAF50; color: white; box-shadow: 0 4px 15px rgba(76, 175, 80, 0.4); }
    .btn-red { background: #f44336; color: white; box-shadow: 0 4px 15px rgba(244, 67, 54, 0.4); }
    #hud {
      position: fixed; top: 0; left: 0; width: 100%; padding: 15px 20px;
      display: flex; justify-content: space-between; align-items: center;
      pointer-events: none; z-index: 10;
    }
    #hud-left { display: flex; align-items: center; gap: 15px; pointer-events: auto; }
    #pause-btn {
      background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2);
      color: white; font-size: 20px; padding: 6px 12px; border-radius: 8px;
      cursor: pointer; backdrop-filter: blur(4px);
    }
    #hud span { font-size: 20px; font-weight: bold; text-shadow: 0 2px 5px rgba(0,0,0,0.8); }
    #hud-right span { color: #ff5252; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div id="game-wrap"><canvas id="game"></canvas></div>

  <div id="hud" class="hidden">
    <div id="hud-left">
      <button id="pause-btn">⏸️</button>
      <span id="timer">00:00</span>
    </div>
    <div id="hud-right"><span id="falls">Падений: 0</span></div>
  </div>

  <div id="start-screen" class="overlay">
    <h1>Getting Over It</h1>
    <p>2D Clone</p>
    <button id="start-btn" class="btn-green">Играть</button>
  </div>

  <div id="pause-menu" class="overlay hidden">
    <h2>Пауза</h2>
    <button id="resume-btn" class="btn-green">Продолжить</button>
    <button id="restart-btn" class="btn-red">Начать заново</button>
  </div>

  <div id="win-screen" class="overlay hidden">
    <h1>Победа!</h1>
    <p>Время: <span id="win-time">00:00</span></p>
    <p>Падений: <span id="win-falls">0</span></p>
    <button id="win-restart-btn" class="btn-green">Играть снова</button>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
